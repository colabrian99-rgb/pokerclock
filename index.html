<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="블라인드 클락">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>포커 블라인드 클락</title>
<style>
:root{--bg:#0b1020;--panel:#151d33;--panel2:#1c2742;--line:#2a3658;--text:#eef2ff;--muted:#8d97b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border-radius:12px;padding:12px 16px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
button:active{transform:scale(.97)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.brand{font-weight:800;color:var(--muted);font-size:15px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:4px 16px 28px;text-align:center}
.lvl{font-size:17px;color:var(--muted);font-weight:700}
.blinds{font-size:clamp(30px,9vw,52px);font-weight:900;line-height:1.1}
.ante{font-size:16px;color:var(--muted);min-height:22px}
.isBreak .blinds{color:var(--green)}
.timer{font-size:clamp(84px,32vw,210px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-3px;line-height:1;cursor:pointer;margin:6px 0}
.timer.warn{color:var(--amber)}
.timer.danger{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.hint2{font-size:13px;color:var(--muted)}
.bar{width:min(92vw,560px);height:12px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s linear}
.ctl{width:min(92vw,560px)}
.ctl .big{width:100%;font-size:24px;padding:20px;border-radius:16px;background:var(--green);border-color:var(--green);color:#052e16;font-weight:900}
.ctl .big.run{background:var(--amber);border-color:var(--amber);color:#3b2400}
.nav,.adj{display:grid;gap:8px;width:min(92vw,560px)}
.nav{grid-template-columns:1fr 1fr 1fr}
.adj{grid-template-columns:repeat(4,1fr)}
.adj button{padding:12px 4px;font-size:15px}
.next{width:min(92vw,560px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.next h4{margin:0 0 6px;font-size:13px;color:var(--muted)}
.next .r{display:flex;justify-content:space-between;font-size:15px;padding:6px 0;border-top:1px dashed var(--line)}
.next .r:first-of-type{border-top:0}
.next .b{font-weight:700}
.totals{display:flex;gap:20px;font-size:14px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.totals b{color:var(--text);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal.hide{display:none}
.sheet{background:var(--panel);width:min(100%,760px);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;border:1px solid var(--line)}
@media(min-width:800px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheetHead h2{margin:0;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;font-size:15px}
.row input{width:80px;text-align:center}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
th,td{padding:6px 2px;border-bottom:1px solid var(--line);text-align:center;overflow:hidden}
th{color:var(--muted);font-weight:700;font-size:12px}
td input{text-align:center;padding:6px 2px;width:100%;font-size:14px}
td select{padding:6px 0;width:100%;font-size:13px;text-overflow:clip}
tr.cur{background:rgba(34,197,94,.10)}
tr.cur td:first-child{color:var(--green);font-weight:900}
.del{padding:6px 0;font-size:12px;color:var(--red);width:100%}
.hint{font-size:13px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="brand">포커 블라인드 클락</div>
  <button id="openSet">설정</button>
</header>

<main id="main">
  <div class="lvl" id="lvl"></div>
  <div class="blinds" id="blinds"></div>
  <div class="ante" id="ante"></div>
  <div class="timer" id="timer" title="눌러서 남은 시간 직접 입력">00:00</div>
  <div class="hint2">숫자를 누르면 남은 시간을 직접 입력할 수 있어요</div>
  <div class="bar"><i id="bar"></i></div>

  <div class="ctl"><button class="big" id="startBtn">시작</button></div>

  <div class="nav">
    <button id="prevBtn">이전 레벨</button>
    <button id="nextBtn">다음 레벨</button>
    <button id="resetBtn">처음부터</button>
  </div>

  <div class="adj">
    <button data-adj="-60">-1분</button>
    <button data-adj="-10">-10초</button>
    <button data-adj="10">+10초</button>
    <button data-adj="60">+1분</button>
  </div>

  <div class="next">
    <h4>다음 레벨</h4>
    <div id="upcoming"></div>
  </div>

  <div class="totals">
    <span>경과 <b id="elapsed">0:00:00</b></span>
    <span>남은 총 시간 <b id="totalLeft">0:00:00</b></span>
  </div>
</main>

<div class="modal hide" id="modal">
  <div class="sheet">
    <div class="sheetHead"><h2>설정</h2><button id="closeSet">닫기</button></div>

    <div class="row">
      <span>전체 레벨 시간</span>
      <input id="allMin" type="number" min="1" step="1" value="20">
      <span>분</span>
      <button id="applyAll">모두 적용</button>
    </div>

    <div class="tbl">
      <table>
        <colgroup><col style="width:24px"><col style="width:78px"><col style="width:52px"><col style="width:56px"><col style="width:46px"><col style="width:44px"><col style="width:46px"></colgroup>
        <thead><tr><th>#</th><th>종류</th><th>SB</th><th>BB</th><th>앤티</th><th>분</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="row">
      <button id="addLvl">레벨 추가</button>
      <button id="defLvl">기본 블라인드로 되돌리기</button>
    </div>

    <p class="hint">
      금액이나 시간을 고치면 바로 반영돼요. 종류를 "휴식"으로 고르면 블라인드 없이 시간만 흘러가요.
      진행 중인 레벨의 시간을 바꾸면 그 레벨의 남은 시간이 새 값으로 바뀌어요.
      키보드: 스페이스 = 시작/일시정지, 좌우 화살표 = 이전/다음 레벨.
    </p>
  </div>
</div>

<script>
const KEY = 'pokerBlindClock.v1';
const DEFAULTS = [
  {type:'blind', sb:25,   bb:50,   ante:0,   min:20},
  {type:'blind', sb:50,   bb:100,  ante:0,   min:20},
  {type:'blind', sb:75,   bb:150,  ante:0,   min:20},
  {type:'blind', sb:100,  bb:200,  ante:25,  min:20},
  {type:'break', min:10},
  {type:'blind', sb:150,  bb:300,  ante:25,  min:20},
  {type:'blind', sb:200,  bb:400,  ante:50,  min:20},
  {type:'blind', sb:300,  bb:600,  ante:75,  min:20},
  {type:'blind', sb:400,  bb:800,  ante:100, min:20},
  {type:'blind', sb:600,  bb:1200, ante:200, min:20},
  {type:'blind', sb:800,  bb:1600, ante:200, min:20},
  {type:'blind', sb:1000, bb:2000, ante:300, min:20},
];

const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const num = n => Number(n || 0).toLocaleString('ko-KR');

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.levels) && d.levels.length){
      return {levels:d.levels, idx:Math.min(d.idx||0, d.levels.length-1), remain:d.remain, elapsed:d.elapsed||0, warned:!!d.warned};
    }
  }catch(e){}
  return null;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({levels:st.levels, idx:st.idx, remain:st.remain, elapsed:st.elapsed, warned:st.warned})); }catch(e){}
}

let st = load() || {levels:clone(DEFAULTS), idx:0, remain:null, elapsed:0, warned:false};
st.running = false;   // always start paused after reload

function minOf(i){ const m = Number(st.levels[i].min); return (isFinite(m) && m > 0) ? m : 1; }
function secs(i){ return Math.max(1, Math.round(minOf(i) * 60)); }
if(st.remain == null) st.remain = secs(st.idx);

function fmt(s){           // timer display
  s = Math.max(0, Math.ceil(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  const p = n => String(n).padStart(2,'0');
  return h > 0 ? `${h}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`;
}
function hms(s){           // totals display
  s = Math.max(0, Math.floor(s));
  const p = n => String(n).padStart(2,'0');
  return `${Math.floor(s/3600)}:${p(Math.floor(s%3600/60))}:${p(s%60)}`;
}

function render(){
  const L = st.levels[st.idx], isB = L.type === 'break', n = st.levels.length;
  $('lvl').textContent = `레벨 ${st.idx+1} / ${n}` + (isB ? '  ·  휴식' : '');
  $('main').classList.toggle('isBreak', isB);
  $('blinds').textContent = isB ? '휴식 시간' : `${num(L.sb)} / ${num(L.bb)}`;
  $('ante').textContent = isB ? '' : (L.ante > 0 ? `앤티 ${num(L.ante)}` : '앤티 없음');

  const t = $('timer');
  t.textContent = fmt(st.remain);
  t.className = 'timer' + (st.remain <= 10 ? ' danger' : st.remain <= 60 ? ' warn' : '');

  const total = secs(st.idx);
  $('bar').style.width = Math.min(100, Math.max(0, (1 - st.remain/total) * 100)) + '%';

  const sb = $('startBtn');
  sb.textContent = st.running ? '일시정지' : (st.elapsed > 0 ? '계속' : '시작');
  sb.classList.toggle('run', st.running);

  let up = '';
  for(let j = st.idx+1; j < n && j <= st.idx+3; j++){
    const U = st.levels[j];
    const val = U.type === 'break' ? `휴식 ${minOf(j)}분`
      : `${num(U.sb)} / ${num(U.bb)}` + (U.ante > 0 ? ` · 앤티 ${num(U.ante)}` : '');
    up += `<div class="r"><span>레벨 ${j+1}${U.type==='break'?' (휴식)':''}</span><span class="b">${val}</span></div>`;
  }
  $('upcoming').innerHTML = up || '<div class="r">마지막 레벨이에요</div>';

  let left = st.remain;
  for(let j = st.idx+1; j < n; j++) left += secs(j);
  $('totalLeft').textContent = hms(Math.ceil(left));
  $('elapsed').textContent = hms(st.elapsed);

  document.title = `${fmt(st.remain)} · ${isB ? '휴식' : num(L.sb)+'/'+num(L.bb)} - 포커 블라인드 클락`;
}

// ---------- sound / screen ----------
let ac = null;
function ensureAudio(){
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
  }catch(e){}
}
function beep(n){
  ensureAudio();
  try{
    if(ac){
      for(let i = 0; i < n; i++){
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
        const t = ac.currentTime + i*0.35;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5, t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.25);
        o.start(t); o.stop(t+0.3);
      }
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(n*200);
}
let wake = null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wake){
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => wake = null);
    } else if(!on && wake){
      await wake.release(); wake = null;
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && st.running) keepAwake(true);
});

// ---------- timer loop (uses real elapsed time, so it stays accurate) ----------
let last = performance.now(), lastSave = 0;
function tick(){
  const now = performance.now();
  const dt = (now - last) / 1000; last = now;
  if(!st.running) return;

  st.elapsed += dt;
  st.remain -= dt;

  if(!st.warned && st.remain <= 60 && st.remain > 0){ st.warned = true; beep(1); }

  while(st.remain <= 0){
    if(st.idx >= st.levels.length-1){
      st.remain = 0; st.running = false; beep(3); keepAwake(false);
      break;
    }
    const over = -st.remain;
    st.idx++;
    st.remain = secs(st.idx) - over;
    st.warned = false;
    beep(3);
  }

  if(now - lastSave > 1000 || !st.running){ save(); lastSave = now; }
  render();
}
setInterval(tick, 200);

// ---------- actions ----------
function toggle(){
  ensureAudio();
  if(!st.running && st.remain <= 0) st.remain = secs(st.idx);
  st.running = !st.running;
  last = performance.now();
  keepAwake(st.running);
  save(); render();
}
function goLevel(i){
  st.idx = Math.min(Math.max(i, 0), st.levels.length-1);
  st.remain = secs(st.idx);
  st.warned = false;
  save(); render();
}

$('startBtn').onclick = toggle;
$('nextBtn').onclick = () => goLevel(st.idx+1);
$('prevBtn').onclick = () => goLevel(st.idx-1);
$('resetBtn').onclick = () => {
  const ok = confirm('처음(레벨 1)부터 다시 시작할까요?');
  last = performance.now();
  if(!ok) return;
  st.running = false; st.elapsed = 0; keepAwake(false);
  goLevel(0);
};

document.querySelectorAll('[data-adj]').forEach(b => b.onclick = () => {
  st.remain = Math.max(1, st.remain + Number(b.dataset.adj));
  if(st.remain > 60) st.warned = false;
  save(); render();
});

$('timer').onclick = () => {
  const c = Math.ceil(st.remain);
  const cur = `${Math.floor(c/60)}:${String(c%60).padStart(2,'0')}`;
  const v = prompt('남은 시간 입력 (예: 12 = 12분, 12:30 = 12분 30초)', cur);
  last = performance.now();
  if(v == null) return;
  const m = v.trim().match(/^(\d{1,3})(?::(\d{1,2}))?$/);
  if(!m){ alert('형식이 맞지 않아요. 예: 12 또는 12:30'); return; }
  const s = m[2] != null ? (+m[1])*60 + (+m[2]) : (+m[1])*60;
  if(s <= 0){ alert('0보다 큰 시간을 입력하세요.'); return; }
  st.remain = s; st.warned = s <= 60;
  save(); render();
};

document.addEventListener('keydown', e => {
  if(!$('modal').classList.contains('hide')){
    if(e.key === 'Escape') closeSet();
    return;
  }
  if(e.target.tagName === 'INPUT') return;
  if(e.code === 'Space'){ e.preventDefault(); toggle(); }
  else if(e.key === 'ArrowRight') goLevel(st.idx+1);
  else if(e.key === 'ArrowLeft') goLevel(st.idx-1);
});

// ---------- settings ----------
function renderRows(){
  $('rows').innerHTML = st.levels.map((L, i) => {
    const brk = L.type === 'break', dis = brk ? 'disabled' : '';
    return `<tr class="${i===st.idx?'cur':''}">
      <td>${i+1}</td>
      <td><select data-i="${i}" data-k="type">
        <option value="blind"${brk?'':' selected'}>블라인드</option>
        <option value="break"${brk?' selected':''}>휴식</option>
      </select></td>
      <td><input type="number" min="0" inputmode="numeric" data-i="${i}" data-k="sb" value="${brk?'':(L.sb??0)}" ${dis}></td>
      <td><input type="number" min="0" inputmode="numeric" data-i="${i}" data-k="bb" value="${brk?'':(L.bb??0)}" ${dis}></td>
      <td><input type="number" min="0" inputmode="numeric" data-i="${i}" data-k="ante" value="${brk?'':(L.ante||0)}" ${dis}></td>
      <td><input type="number" min="0.5" step="0.5" inputmode="decimal" data-i="${i}" data-k="min" value="${minOf(i)}"></td>
      <td><button class="del" data-del="${i}">삭제</button></td>
    </tr>`;
  }).join('');
}
function openSet(){ renderRows(); $('modal').classList.remove('hide'); }
function closeSet(){ $('modal').classList.add('hide'); render(); }
$('openSet').onclick = openSet;
$('closeSet').onclick = closeSet;
$('modal').onclick = e => { if(e.target.id === 'modal') closeSet(); };

// typing: update live without re-rendering the table (keeps focus)
$('rows').addEventListener('input', e => {
  const t = e.target; if(!t.dataset.k) return;
  const i = +t.dataset.i, k = t.dataset.k, L = st.levels[i];
  if(k === 'min'){
    L.min = Math.max(0.5, Number(t.value) || 1);
    if(i === st.idx){ st.remain = secs(i); st.warned = false; }
  } else {
    L[k] = Math.max(0, Number(t.value) || 0);
  }
  save(); render();
});
$('rows').addEventListener('change', e => {
  const t = e.target; if(t.dataset.k !== 'type') return;
  const i = +t.dataset.i, L = st.levels[i];
  if(t.value === 'break'){
    L.type = 'break';
  } else {
    L.type = 'blind';
    if(L.sb == null){
      const prev = st.levels.slice(0, i).reverse().find(x => x.type === 'blind');
      L.sb = prev ? prev.sb*2 : 100;
      L.bb = prev ? prev.bb*2 : 200;
      L.ante = prev ? (prev.ante||0) : 0;
    }
  }
  renderRows(); save(); render();
});
$('rows').addEventListener('click', e => {
  const d = e.target.dataset.del; if(d == null) return;
  const i = +d;
  if(st.levels.length <= 1){ alert('레벨은 최소 1개는 있어야 해요.'); return; }
  st.levels.splice(i, 1);
  if(i < st.idx) st.idx--;
  else if(i === st.idx){ st.idx = Math.min(st.idx, st.levels.length-1); st.remain = secs(st.idx); st.warned = false; }
  renderRows(); save(); render();
});
$('addLvl').onclick = () => {
  const last2 = st.levels[st.levels.length-1];
  const prev = [...st.levels].reverse().find(x => x.type === 'blind') || {sb:50, bb:100, ante:0};
  st.levels.push({type:'blind', sb:prev.sb*2, bb:prev.bb*2, ante:prev.ante ? prev.ante*2 : 0, min:last2.min});
  renderRows(); save(); render();
};
$('applyAll').onclick = () => {
  const m = Math.max(0.5, Number($('allMin').value) || 20);
  st.levels.forEach(L => L.min = m);
  st.remain = secs(st.idx); st.warned = false;
  renderRows(); save(); render();
};
$('defLvl').onclick = () => {
  const ok = confirm('블라인드 표를 기본값으로 되돌릴까요?\n(현재 레벨의 남은 시간도 새로 시작돼요)');
  last = performance.now();
  if(!ok) return;
  st.levels = clone(DEFAULTS);
  st.idx = Math.min(st.idx, st.levels.length-1);
  st.remain = secs(st.idx); st.warned = false;
  renderRows(); save(); render();
};

render();
</script>
</body>
</html>
